openapi: 3.1.0
info:
  title: Penroam Sync Protocol
  version: "1.10"
  description: |
    HTTP mapping of the Penroam sync protocol (major 1, minor 10). The normative text is
    sync-protocol-v1.md in this directory; the Rust types are in the penroam-sync-protocol crate.
    This file is hand-written. A test in crates/penroam-sync-protocol checks that it lists
    every route the crate defines.

    Every response carries a Penroam-Request-Id header. Errors use the ErrorBody schema with the
    HTTP status from the error-code table (§9); when retry_after_ms is set, a Retry-After header
    (whole seconds) is sent too. Bodies need Content-Length. Optional features are gated by the
    capability strings in ServerMeta.capabilities.
  license:
    name: MPL-2.0
servers:
  - url: http://127.0.0.1:8787
    description: Development test server (loopback only)
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Opaque token. "Account" tokens identify an account; "device" tokens identify a device of
        that account and are accepted everywhere. With auth.v1 they come from /v1/auth/*.
  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    BlobId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NoContent:
      description: Done
  schemas:
    SignedCatalog:
      type: object
      required: [key_id, catalog, signature]
      properties:
        key_id: { type: string }
        catalog: { type: string, description: The ModelCatalog as JSON text; signed byte for byte }
        signature: { type: string, description: Base64url Ed25519 signature }
    Id:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,128}$"
    Cursor:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,512}$"
    ProtocolVersion:
      type: object
      required: [major, minor]
      properties:
        major: { type: integer, minimum: 0 }
        minor: { type: integer, minimum: 0 }
    Limits:
      type: object
      required: [max_batch_envelopes, max_batch_bytes, max_ciphertext_bytes_per_op,
                 max_header_json_bytes, max_blob_bytes, max_depends_on, max_pull_page_size,
                 max_id_length]
      properties:
        max_batch_envelopes: { type: integer }
        max_batch_bytes: { type: integer }
        max_ciphertext_bytes_per_op: { type: integer }
        max_header_json_bytes: { type: integer }
        max_blob_bytes: { type: integer }
        max_depends_on: { type: integer }
        max_pull_page_size: { type: integer }
        max_id_length: { type: integer }
    ServerMeta:
      type: object
      required: [min_client_protocol, max_client_protocol, capabilities, limits, server_instance_id]
      properties:
        min_client_protocol: { $ref: "#/components/schemas/ProtocolVersion" }
        max_client_protocol: { $ref: "#/components/schemas/ProtocolVersion" }
        capabilities: { type: array, items: { type: string } }
        limits: { $ref: "#/components/schemas/Limits" }
        server_instance_id: { type: string }
    ErrorBody:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Machine code from the §9 table; unknown codes are treated as not retryable.
        message: { type: string }
        request_id: { type: string }
        retry_after_ms: { type: integer }
    OpRef:
      type: object
      required: [device_id, device_seq]
      properties:
        device_id: { $ref: "#/components/schemas/Id" }
        device_seq: { type: integer }
    EnvelopeHeader:
      type: object
      additionalProperties: false
      required: [envelope_version, op_id, device_id, device_seq, notebook_id, depends_on,
                 key_epoch, op_schema_version, ciphertext_sha256, ciphertext_length, signature]
      properties:
        envelope_version: { type: integer, const: 1 }
        op_id: { $ref: "#/components/schemas/Id" }
        device_id: { $ref: "#/components/schemas/Id" }
        device_seq: { type: integer }
        notebook_id: { $ref: "#/components/schemas/Id" }
        depends_on: { type: array, items: { $ref: "#/components/schemas/OpRef" } }
        key_epoch: { type: integer }
        op_schema_version: { type: integer, minimum: 1 }
        ciphertext_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        ciphertext_length: { type: integer, minimum: 1 }
        signature: { type: string }
    PulledOp:
      type: object
      required: [server_seq, header]
      properties:
        server_seq: { type: integer }
        header: { $ref: "#/components/schemas/EnvelopeHeader" }
    AckResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, duplicate, rejected] }
        server_seq: { type: integer }
        error: { $ref: "#/components/schemas/ErrorBody" }
    PushOpsResponse:
      type: object
      required: [acks]
      properties:
        acks:
          type: array
          items:
            type: object
            required: [op_id, result]
            properties:
              op_id: { $ref: "#/components/schemas/Id" }
              result: { $ref: "#/components/schemas/AckResult" }
    PullOpsResponse:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PulledOp" } }
        next_cursor: { $ref: "#/components/schemas/Cursor" }
        has_more: { type: boolean }
    AckRequest:
      type: object
      required: [applied_cursor]
      properties:
        applied_cursor: { $ref: "#/components/schemas/Cursor" }
    AccountState:
      type: object
      required: [account_id, plan, storage, writable]
      properties:
        account_id: { $ref: "#/components/schemas/Id" }
        plan:
          type: object
          required: [id, name, status]
          properties:
            id: { type: string }
            name: { type: string }
            status: { type: string, description: "free, trialing, active, canceling, past_due, granted (open set)" }
            renews_at_unix_s: { type: integer }
            ends_at_unix_s: { type: integer }
            managed_in: { type: string, description: "web, app_store, google_play (open set)" }
        storage:
          type: object
          required: [used_bytes, quota_bytes]
          properties:
            used_bytes: { type: integer }
            quota_bytes: { type: [integer, "null"] }
            free_quota_bytes: { type: integer }
        writable: { type: boolean }
        read_only_reason: { type: string, description: "over_quota, suspended, deletion_pending (open set)" }
        offers:
          type: array
          maxItems: 8
          items:
            type: object
            required: [id, name, price_label, quota_bytes]
            properties:
              id: { type: string }
              name: { type: string }
              price_label: { type: string }
              quota_bytes: { type: integer }
              store_products:
                type: object
                properties:
                  apple_product_id: { type: string }
                  google_product_id: { type: string }
                  google_base_plan_id: { type: string }
        actions:
          type: array
          items: { type: string, description: "subscribe, subscribe_in_store, manage_billing, request_deletion, cancel_deletion (open set)" }
        deletion: { $ref: "#/components/schemas/DeletionState" }
        store_account_token: { type: string, format: uuid }
    DeletionState:
      type: object
      required: [requested_at_unix_s, erase_after_unix_s]
      properties:
        requested_at_unix_s: { type: integer }
        erase_after_unix_s: { type: integer }
    UsageResponse:
      type: object
      required: [account_id, op_count, op_bytes, blob_count, blob_bytes]
      properties:
        account_id: { $ref: "#/components/schemas/Id" }
        op_count: { type: integer }
        op_bytes: { type: integer }
        blob_count: { type: integer }
        blob_bytes: { type: integer }
        quota_bytes: { type: [integer, "null"] }
    DeviceRegistrationRequest:
      type: object
      required: [signing_public_key, encryption_public_key]
      properties:
        device_id: { $ref: "#/components/schemas/Id" }
        signing_public_key: { type: string }
        encryption_public_key: { type: string }
        label: { type: [string, "null"] }
    DeviceRegistrationResponse:
      type: object
      required: [device_id]
      properties:
        device_id: { $ref: "#/components/schemas/Id" }
    DeviceListResponse:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            type: object
            required: [device_id, signing_public_key, encryption_public_key, revoked]
            properties:
              device_id: { $ref: "#/components/schemas/Id" }
              signing_public_key: { type: string }
              encryption_public_key: { type: string }
              label: { type: [string, "null"] }
              revoked: { type: boolean }
    KeyLogEntry:
      type: object
      required: [index, data]
      properties:
        index: { type: integer }
        data: { type: string, description: Unpadded base64url of the entry bytes }
    KeyLogPage:
      type: object
      required: [entries, next_index]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/KeyLogEntry" } }
        next_index: { type: integer }
    KeyLogAppendRequest:
      type: object
      required: [index, data]
      properties:
        index: { type: integer }
        data: { type: string }
    KeyLogAppendResponse:
      type: object
      required: [index]
      properties:
        index: { type: integer }
    BlobPutResponse:
      type: object
      required: [blob_id, duplicate]
      properties:
        blob_id: { $ref: "#/components/schemas/Id" }
        duplicate: { type: boolean }
    CheckpointRecord:
      type: object
      required: [covers_cursor, covers_server_seq, blob_id, blob_sha256, blob_length, key_epoch,
                 created_by, signature]
      properties:
        covers_cursor: { $ref: "#/components/schemas/Cursor" }
        covers_server_seq: { type: integer }
        blob_id: { $ref: "#/components/schemas/Id" }
        blob_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        blob_length: { type: integer }
        key_epoch: { type: integer }
        created_by: { $ref: "#/components/schemas/Id" }
        signature: { type: string }
    AuthConfig:
      type: object
      required: [issuer, client_id, scopes, redirect]
      properties:
        issuer: { type: string, format: uri }
        client_id: { type: string }
        scopes: { type: array, items: { type: string } }
        redirect: { type: string, enum: [loopback, loopback-ports] }
        loopback_ports:
          description: With redirect loopback-ports, the registered ports, tried in order (1.2).
          type: array
          minItems: 1
          maxItems: 8
          items: { type: integer, minimum: 1, maximum: 65535 }
        mobile_redirect_uri:
          description: Private-use URI scheme redirect for the mobile apps, e.g. ink.penroam.app://callback (1.2).
          type: string
    AccountKeyDocument:
      type: object
      required: [key]
      properties:
        key: { type: string, description: Base64url root secret; opaque to the server }
    VaultLock:
      type: object
      required: [kdf, memory_kib, iterations, parallelism, salt, wrapped_root]
      properties:
        kdf: { type: string, enum: [argon2id] }
        memory_kib: { type: integer }
        iterations: { type: integer }
        parallelism: { type: integer }
        salt: { type: string }
        wrapped_root: { type: string }
    VaultRecord:
      type: object
      required: [vault_id, lock, name, created_at_unix_s]
      properties:
        vault_id: { type: string }
        lock: { $ref: "#/components/schemas/VaultLock" }
        name: { type: string, description: Encrypted by the client }
        created_at_unix_s: { type: integer }
    SessionTokens:
      type: object
      required: [account_id, access_token, expires_in_s, refresh_token]
      properties:
        account_id: { $ref: "#/components/schemas/Id" }
        device_id: { $ref: "#/components/schemas/Id" }
        access_token: { type: string }
        expires_in_s: { type: integer }
        refresh_token: { type: string }
    Role:
      type: string
      enum: [owner, editor, viewer, commenter]
      description: commenter from protocol 1.9; clients read unknown roles as read-only
    MembershipState:
      type: string
      enum: [active, revoked]
    InvitationState:
      type: string
      enum: [pending, accepted, declined, cancelled, expired]
    NotificationRecord:
      type: object
      required: [notification_id, space_id, thread_id, comment_op_id, kind, actor, created_at_ms, read]
      properties:
        notification_id: { $ref: "#/components/schemas/Id" }
        space_id: { $ref: "#/components/schemas/Id" }
        thread_id: { $ref: "#/components/schemas/Id" }
        comment_op_id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [mention, reply] }
        actor: { $ref: "#/components/schemas/Id" }
        created_at_ms: { type: integer }
        read: { type: boolean }
    NotificationPrefs:
      type: object
      properties:
        muted_spaces:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Id" }
        muted_threads:
          type: array
          maxItems: 500
          items:
            type: object
            required: [space_id, thread_id]
            properties:
              space_id: { $ref: "#/components/schemas/Id" }
              thread_id: { $ref: "#/components/schemas/Id" }
    AttributionPage:
      type: object
      required: [items, next_from_seq, has_more]
      properties:
        items:
          type: array
          items:
            type: object
            required: [server_seq, op_id, account_id, device_id, accepted_at_ms]
            properties:
              server_seq: { type: integer }
              op_id: { $ref: "#/components/schemas/Id" }
              account_id:
                $ref: "#/components/schemas/Id"
              device_id: { $ref: "#/components/schemas/Id" }
              accepted_at_ms: { type: integer }
        next_from_seq: { type: integer, description: One past the last operation scanned }
        has_more:
          type: boolean
          description: limit bounds the operations scanned and operations whose author the server can't establish have no entry, so a page may be empty while this is true
    SealedMeta:
      type: string
      maxLength: 4096
      pattern: "^[A-Za-z0-9_-]+$"
      description: Sealed {notebook_id, title} (sharing.v1, §12f). Opaque to the server.
    SharedNotebookRecord:
      type: object
      required: [space_id, role, state, owner, sealed_meta, version, created_at_ms]
      properties:
        space_id: { $ref: "#/components/schemas/Id" }
        role: { $ref: "#/components/schemas/Role" }
        state: { $ref: "#/components/schemas/MembershipState" }
        owner: { type: boolean }
        sealed_meta: { $ref: "#/components/schemas/SealedMeta" }
        version: { type: integer }
        created_at_ms: { type: integer }
    MemberRecord:
      type: object
      required: [account_id, role, state, display, is_you, version, since_ms]
      properties:
        account_id: { $ref: "#/components/schemas/Id" }
        role: { $ref: "#/components/schemas/Role" }
        state: { $ref: "#/components/schemas/MembershipState" }
        display: { type: string, maxLength: 254, description: Verified email; shown only to members of the space }
        is_you: { type: boolean }
        version: { type: integer }
        since_ms: { type: integer }
    InvitationRecord:
      type: object
      required: [invitation_id, email, role, state, expires_at_ms, version]
      properties:
        invitation_id: { $ref: "#/components/schemas/Id" }
        email: { type: string, maxLength: 254 }
        role: { $ref: "#/components/schemas/Role" }
        state: { $ref: "#/components/schemas/InvitationState" }
        expires_at_ms: { type: integer }
        version: { type: integer }
    IncomingInvitation:
      type: object
      required: [invitation_id, space_id, role, invited_by, expires_at_ms]
      properties:
        invitation_id: { $ref: "#/components/schemas/Id" }
        space_id: { $ref: "#/components/schemas/Id" }
        role: { $ref: "#/components/schemas/Role" }
        invited_by: { type: string, maxLength: 254, description: The owner's verified email }
        expires_at_ms: { type: integer }
paths:
  /v1/meta:
    get:
      summary: Protocol range, capabilities, limits, instance id
      security: []
      responses:
        "200":
          description: Server metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerMeta" }
  /v1/devices:
    post:
      summary: Register a device's public keys (account token). In a shared notebook's space a member's live devices are capped (409 conflict; sharing.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistrationRequest" }
      responses:
        "200":
          description: Registered (idempotent for the same id and keys)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRegistrationResponse" }
        default: { $ref: "#/components/responses/Error" }
    get:
      summary: List devices (informational; membership comes from the key log)
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceListResponse" }
        default: { $ref: "#/components/responses/Error" }
  /v1/devices/{id}:
    delete:
      summary: Revoke a device (device token)
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/ops/batch:
    post:
      summary: Push a PRSB frame of envelopes (device token)
      requestBody:
        required: true
        content:
          application/vnd.penroam.batch.v1:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: One ack per framed item, in order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushOpsResponse" }
        default: { $ref: "#/components/responses/Error" }
  /v1/ops:
    get:
      summary: Pull envelopes after a cursor (device token)
      parameters:
        - { name: cursor, in: query, schema: { $ref: "#/components/schemas/Cursor" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: |
            With Accept application/vnd.penroam.batch.v1 (default): a PRSB frame of PulledOp
            items plus Penroam-Next-Cursor and Penroam-Has-More headers. With Accept
            application/json: the control document without ciphertexts.
          headers:
            Penroam-Next-Cursor: { schema: { $ref: "#/components/schemas/Cursor" } }
            Penroam-Has-More: { schema: { type: string, enum: ["true", "false"] } }
          content:
            application/vnd.penroam.batch.v1:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: "#/components/schemas/PullOpsResponse" }
        default: { $ref: "#/components/responses/Error" }
  /v1/acks:
    post:
      summary: Durably applied cursor of this device (device token)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AckRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/usage:
    get:
      summary: Usage counters and quota
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageResponse" }
        default: { $ref: "#/components/responses/Error" }
  /v1/keylog:
    get:
      summary: Key-log entries from an index (at most 256)
      parameters:
        - { name: from, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyLogPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Append at exactly the current length (409 conflict otherwise). In a shared notebook's space, non-owners may only add, rename or remove their own devices (403), and a removeDevice must grant the new epoch to every remaining device and recovery (422 validation_failed; sharing.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyLogAppendRequest" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyLogAppendResponse" }
        default: { $ref: "#/components/responses/Error" }
  /v1/blobs/uploads:
    post:
      summary: Reserved; not implemented in protocol 1.x (blobs use PUT /v1/blobs/{id})
      responses:
        "404": { $ref: "#/components/responses/Error" }
  /v1/blobs/{id}:
    put:
      summary: Upload an immutable encrypted blob (device token)
      parameters:
        - { $ref: "#/components/parameters/BlobId" }
        - name: Penroam-Content-Sha256
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored, or identical bytes already stored (duplicate)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobPutResponse" }
        default: { $ref: "#/components/responses/Error" }
    get:
      summary: Download a blob (device token)
      parameters: [{ $ref: "#/components/parameters/BlobId" }]
      responses:
        "200":
          description: Raw ciphertext
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /v1/checkpoints:
    post:
      summary: Advertise a signed checkpoint (device token; blob uploaded first). In a shared notebook's space only the owner may (403 forbidden for editors and viewers; sharing.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckpointRecord" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/checkpoints/latest:
    get:
      summary: Latest checkpoint record (404 not_found if none)
      responses:
        "200":
          description: Record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckpointRecord" }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/config:
    get:
      summary: OpenID Connect issuer and public client id (auth.v1)
      security: []
      responses:
        "200":
          description: Sign-in configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /v1/auth/session:
    post:
      summary: Exchange an ID token for an account session (auth.v1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        "200":
          description: Account session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionTokens" }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/refresh:
    post:
      summary: Rotate a single-use refresh token (auth.v1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New tokens, same scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionTokens" }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      summary: Revoke the caller's session (auth.v1)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/device-challenge:
    post:
      summary: One-time challenge for a device session (auth.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                type: object
                required: [challenge, expires_in_s]
                properties:
                  challenge: { type: string }
                  expires_in_s: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/device-session:
    post:
      summary: Signed challenge in, device session out (auth.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, challenge, signature]
              properties:
                device_id: { $ref: "#/components/schemas/Id" }
                challenge: { type: string }
                signature: { type: string }
      responses:
        "200":
          description: Device session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionTokens" }
        default: { $ref: "#/components/responses/Error" }
  /v1/models/catalog:
    get:
      summary: The signed handwriting model catalog; no token (models.v1, §12c)
      security: []
      responses:
        "200":
          description: Signed catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedCatalog" }
        default: { $ref: "#/components/responses/Error" }
  /v1/models/files/{sha256}:
    get:
      summary: A model archive by its SHA-256; no token (models.v1, §12c)
      security: []
      parameters:
        - { name: sha256, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
      responses:
        "200":
          description: The .penroam-model archive
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /v1/account:
    get:
      summary: Plan, storage allowance and available actions (account.v1)
      responses:
        "200":
          description: Account state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountState" }
        default: { $ref: "#/components/responses/Error" }
  /v1/account/billing-link:
    post:
      summary: Server-made https link to the billing pages, opened in the system browser (account.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [subscribe, manage_billing] }
                offer_id: { type: string }
      responses:
        "200":
          description: Billing link
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_in_s]
                properties:
                  url: { type: string, format: uri, maxLength: 2048 }
                  expires_in_s: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /v1/account/key:
    get:
      summary: The account's stored root secret; account sessions only, refused for vaults (account-key.v1)
      responses:
        "200":
          description: The stored key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountKeyDocument" }
        default: { $ref: "#/components/responses/Error" }
    put:
      summary: Store the root secret once; 409 conflict if one is stored, refused for vaults (account-key.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountKeyDocument" }
      responses:
        "204": { description: Stored }
        default: { $ref: "#/components/responses/Error" }
  /v1/vaults:
    get:
      summary: The account's vaults, oldest first (vaults.v1)
      responses:
        "200":
          description: Every vault of the account
          content:
            application/json:
              schema:
                type: object
                required: [vaults]
                properties:
                  vaults:
                    type: array
                    items: { $ref: "#/components/schemas/VaultRecord" }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Create a vault and its hidden account (vaults.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lock, name]
              properties:
                lock: { $ref: "#/components/schemas/VaultLock" }
                name: { type: string, description: Encrypted by the client }
      responses:
        "200":
          description: The new vault
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultRecord" }
        default: { $ref: "#/components/responses/Error" }
  /v1/vaults/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace a vault's passphrase lock (vaults.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lock]
              properties:
                lock: { $ref: "#/components/schemas/VaultLock" }
      responses:
        "204": { description: Replaced }
        default: { $ref: "#/components/responses/Error" }
    delete:
      summary: Erase a vault's cloud copy (vaults.v1)
      responses:
        "204": { description: Erased }
        default: { $ref: "#/components/responses/Error" }
  /v1/vaults/{id}/session:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Get an account session for the vault's own account (vaults.v1)
      responses:
        "200":
          description: A session scoped to the vault
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionTokens" }
        default: { $ref: "#/components/responses/Error" }
  /v1/shared-notebooks:
    get:
      summary: Spaces the caller owns or belongs to, including revoked memberships, oldest first (sharing.v1)
      responses:
        "200":
          description: The caller's shared notebooks
          content:
            application/json:
              schema:
                type: object
                required: [spaces]
                properties:
                  spaces:
                    type: array
                    items: { $ref: "#/components/schemas/SharedNotebookRecord" }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Create a sharing space owned by the caller; idempotent per idempotency_key (sharing.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, sealed_meta]
              properties:
                idempotency_key: { $ref: "#/components/schemas/Id" }
                sealed_meta: { $ref: "#/components/schemas/SealedMeta" }
      responses:
        "200":
          description: The space, with the caller as owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedNotebookRecord" }
        default: { $ref: "#/components/responses/Error" }
  /v1/shared-notebooks/{id}/meta:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    put:
      summary: Replace the sealed notebook id and title; owner only (sharing.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sealed_meta]
              properties:
                sealed_meta: { $ref: "#/components/schemas/SealedMeta" }
      responses:
        "204": { description: Replaced }
        default: { $ref: "#/components/responses/Error" }
  /v1/shared-notebooks/{id}/session:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      summary: Get an account session on the space acting as the caller; active members (sharing.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: A session scoped to the space
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionTokens" }
        default: { $ref: "#/components/responses/Error" }
  /v1/shared-notebooks/{id}/key:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    get:
      summary: The space's root secret; active members; 404 until stored (sharing.v1)
      responses:
        "200":
          description: The stored key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountKeyDocument" }
        default: { $ref: "#/components/responses/Error" }
    put:
      summary: Store the space's root secret once; owner only; 409 conflict if one is stored (sharing.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountKeyDocument" }
      responses:
        "204": { description: Stored }
        default: { $ref: "#/components/responses/Error" }
  /v1/shared-notebooks/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    get:
      summary: Members, and for the owner the space's invitations; every active member whatever the role, including viewers and commenters (sharing.v1)
      responses:
        "200":
          description: Members and invitations
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/MemberRecord" }
                  invitations:
                    type: array
                    description: Empty for everyone but the owner
                    items: { $ref: "#/components/schemas/InvitationRecord" }
        default: { $ref: "#/components/responses/Error" }
  /v1/shared-notebooks/{id}/members/{account_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      - { name: account_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    patch:
      summary: Change a member's role; owner only; version must be the member's current one (sharing.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, version]
              properties:
                role: { type: string, enum: [editor, viewer] }
                version: { type: integer }
      responses:
        "200":
          description: The updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberRecord" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a member (owner), or leave (the member themselves); the owner cannot leave (sharing.v1)
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }
  /v1/shared-notebooks/{id}/invitations:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      summary: Invite an email address; owner only; same answer whether or not it belongs to an account (sharing.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role, idempotency_key]
              properties:
                email: { type: string, maxLength: 254 }
                role: { type: string, enum: [editor, viewer] }
                idempotency_key: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: The invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationRecord" }
        default: { $ref: "#/components/responses/Error" }
  /v1/invitations:
    get:
      summary: Pending, unexpired invitations for the caller's verified email; if that verification is older than the server allows, an empty list with reauth_required true (sharing.v1)
      responses:
        "200":
          description: Incoming invitations, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/IncomingInvitation" }
                  reauth_required:
                    type: boolean
                    default: false
                    description: Sign in again to see invitations; omitted when false
        default: { $ref: "#/components/responses/Error" }
  /v1/invitations/{inv}:
    parameters:
      - { name: inv, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    delete:
      summary: Cancel a pending invitation; space owner only, everyone else gets the 404 an unknown id gets (sharing.v1)
      responses:
        "204": { description: Cancelled }
        default: { $ref: "#/components/responses/Error" }
  /v1/invitations/{inv}/accept:
    parameters:
      - { name: inv, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      summary: Join the space; idempotent; 410 invitation_expired after expiry; 403 reauth_required if the email verification is older than the server allows (sharing.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: The joined space
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedNotebookRecord" }
        default: { $ref: "#/components/responses/Error" }
  /v1/invitations/{inv}/decline:
    parameters:
      - { name: inv, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    post:
      summary: Decline an invitation; idempotent; 403 reauth_required if the email verification is older than the server allows (sharing.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204": { description: Declined }
        default: { $ref: "#/components/responses/Error" }
  /v1/comments/batch:
    post:
      summary: Push to the space's comment stream; owner, editor and commenter (comments.v1)
      description: |
        PRSB frame (application/vnd.penroam.batch.v1) whose item headers are CommentPushItem JSON
        objects {envelope, thread_id, kind, mentions?}; envelope is the signed EnvelopeHeader, kind
        is "comment" (a new comment; creates reply notifications) or "update" (edit, delete,
        resolve, reopen, re-anchor; notifies only mentions), read as "comment" when absent; mentions at
        most 20 distinct active members. Per-item acks as for /v1/ops/batch.
      requestBody:
        required: true
        content:
          application/vnd.penroam.batch.v1:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: One ack per item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushOpsResponse" }
        default: { $ref: "#/components/responses/Error" }
  /v1/comments:
    get:
      summary: Page through the space's comment stream; every active member (comments.v1)
      parameters:
        - { name: cursor, in: query, schema: { $ref: "#/components/schemas/Cursor" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: A PRSB frame of PulledComment {server_seq, header, thread_id, member} items, or with Accept application/json the control document {items, next_cursor, has_more}
          content:
            application/vnd.penroam.batch.v1:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Error" }
  /v1/comments/acks:
    post:
      summary: Acknowledge the applied comment-stream cursor (comments.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AckRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/notifications:
    get:
      summary: The caller's notifications, oldest first, from spaces they're still in (comments.v1)
      parameters:
        - { name: cursor, in: query, schema: { $ref: "#/components/schemas/Cursor" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: A page of notifications
          content:
            application/json:
              schema:
                type: object
                required: [notifications, next_cursor, has_more, unread]
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationRecord" }
                  next_cursor: { $ref: "#/components/schemas/Cursor" }
                  has_more: { type: boolean }
                  unread: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /v1/notifications/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
    patch:
      summary: Mark a notification read or unread (comments.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read: { type: boolean }
      responses:
        "200":
          description: The updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationRecord" }
        default: { $ref: "#/components/responses/Error" }
  /v1/notification-prefs:
    get:
      summary: The caller's notification mutes (comments.v1)
      responses:
        "200":
          description: Mutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPrefs" }
        default: { $ref: "#/components/responses/Error" }
    put:
      summary: Replace the caller's notification mutes (comments.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPrefs" }
      responses:
        "204": { description: Replaced }
        default: { $ref: "#/components/responses/Error" }
  /v1/attribution:
    get:
      summary: Who pushed each document operation; any active member on a space; erased accounts appear as erased-<32 hex> (history.v1)
      parameters:
        - { name: from_seq, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: Attribution from from_seq on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttributionPage" }
        default: { $ref: "#/components/responses/Error" }
  /v1/comments/attribution:
    get:
      summary: Who pushed each comment of a space's comment stream (history.v1)
      parameters:
        - { name: from_seq, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: Attribution from from_seq on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttributionPage" }
        default: { $ref: "#/components/responses/Error" }
  /v1/checkpoints/previous:
    get:
      summary: The checkpoint before the latest, for recovering from a corrupt latest one; 404 if none (history.v1)
      responses:
        "200":
          description: The previous checkpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckpointRecord" }
        default: { $ref: "#/components/responses/Error" }
  /v1/live:
    get:
      summary: Live channel of one shared notebook's space over WebSocket (live.v1)
      description: |
        WebSocket upgrade (Upgrade: websocket, Sec-WebSocket-Version: 13) authenticated with a
        device session on the space in the Authorization header; never a query-string token. The
        server checks the token, the membership and the device before upgrading, and an Origin
        header, when present, against an allow-list. After the upgrade, frames are JSON text
        tagged by "type" (hello, welcome, committed, awareness, membership, bye, ping, pong; see
        §12g of sync-protocol-v1.md). The channel never writes notebook data.
      parameters:
        - { name: Upgrade, in: header, required: true, schema: { type: string, enum: [websocket] } }
        - { name: Sec-WebSocket-Version, in: header, required: true, schema: { type: string, enum: ["13"] } }
        - { name: Sec-WebSocket-Key, in: header, required: true, schema: { type: string } }
      responses:
        "101": { description: Switched to the WebSocket protocol }
        default: { $ref: "#/components/responses/Error" }
  /v1/account/store-purchase:
    post:
      summary: Tell the server about an app store purchase; it verifies with the store (store-purchases.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store, transaction]
              properties:
                store: { type: string, enum: [app_store, google_play] }
                transaction: { type: string, maxLength: 4096 }
      responses:
        "200":
          description: Account state after the purchase
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountState" }
        default: { $ref: "#/components/responses/Error" }
  /v1/account/deletion:
    post:
      summary: Request account deletion after a cooling-off period; needs a recent sign-in (account.v1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Pending deletion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionState" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      summary: Withdraw a pending deletion request (account.v1)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }

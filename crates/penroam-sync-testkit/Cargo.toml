[package]
publish = false
name = "penroam-sync-testkit"
description = "Public in-memory fake Penroam sync server and deterministic protocol fixture generator (test scaffolding, not production)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
penroam-sync-protocol = { path = "../penroam-sync-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
uuid.workspace = true
# WebSocket for the live channel of the HTTP test server. Pinned exactly; the client crate uses
# the same version. No TLS: the test server is loopback-only.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "penroam-sync-testserver"
path = "src/bin/penroam-sync-testserver.rs"

[[bin]]
name = "penroam-sync-fixtures"
path = "src/bin/penroam-sync-fixtures.rs"

name: release-check

# CI builds Windows and macOS with the debug profile. This catches what only the release profile
# does (fat LTO linking, the release-only compile-time checks) without slowing every push. Linux
# is covered on each push to main, which builds the packages.
on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

jobs:
  release-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: rustup toolchain install --no-self-update
        shell: bash
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --no-bundle

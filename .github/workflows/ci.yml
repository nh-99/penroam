name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Fixtures are deterministic and frozen
        run: pnpm fixtures && git diff --exit-code tests/fixtures
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - name: System libraries (WebKitGTK for the Tauri crate)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev poppler-utils
      - run: mkdir -p apps/desktop-mobile/dist && touch apps/desktop-mobile/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated TypeScript bindings match the Rust schema
        run: git diff --exit-code apps/desktop-mobile/src/generated
      - name: Sync protocol fixtures are deterministic and frozen
        run: cargo run -q -p penroam-sync-testkit --bin penroam-sync-fixtures -- --check crates/penroam-sync-protocol/fixtures/v1
      - name: Fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml

  # The public sync contract builds and tests on its own: no notebook
  # engine, UI, device SDK, private repository or credentials.
  sync-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p penroam-sync-protocol -p penroam-sync-testkit
      - name: No engine/UI/private dependencies
        run: |
          ! cargo tree -p penroam-sync-protocol -e all | grep -E 'penroam-(core|storage|pdf|cloud)|tauri'
          ! grep -rn 'penroam-cloud' --include=Cargo.toml .

  linux-build:
    runs-on: ubuntu-24.04
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb,appimage
      # Start-up smoke tests on both Linux display servers: the app opens its
      # library, runs the quick Workload D on a 1k-stroke page and exits.
      - name: Smoke test on X11 (Xvfb)
        run: |
          sudo apt-get install -y xvfb
          PENROAM_AUTOBENCH=ci-x11,quick,exit PENROAM_RESULTS_DIR=$PWD/ci-results PENROAM_LIBRARY_DIR=$(mktemp -d) \
            GDK_BACKEND=x11 timeout 300 xvfb-run -a target/release/penroam-app
          ls ci-results/perf-m01-workload-d-ci-x11-*.json
      - name: Smoke test on Wayland (headless Weston)
        run: |
          sudo apt-get install -y weston
          export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 $XDG_RUNTIME_DIR
          weston --backend=headless --socket=wl-ci --idle-time=0 & sleep 3
          PENROAM_AUTOBENCH=ci-wayland,quick,exit PENROAM_RESULTS_DIR=$PWD/ci-results PENROAM_LIBRARY_DIR=$(mktemp -d) \
            WAYLAND_DISPLAY=wl-ci GDK_BACKEND=wayland timeout 300 target/release/penroam-app
          ls ci-results/perf-m01-workload-d-ci-wayland-*.json
      - uses: actions/upload-artifact@v4
        with: { name: penroam-linux, path: target/release/bundle }

  # Compatible hosted runners exist; these jobs have not been run yet (see docs/M01-results.md).
  desktop-builds:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p penroam-core -p penroam-storage -p penroam-pdf
      - run: pnpm tauri build --no-bundle

  android-jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: cd android && ./gradlew --no-daemon :boox-ink:testDebugUnitTest

  swift-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: "6.1" }
      - run: cd ios/InkKit && swift test

name: fuzz

# Long-running coverage-guided fuzzing, separate from PR CI (which runs the
# deterministic fuzz smoke tests in `cargo test`).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [decode_page, journal_open, sync_batch_frame]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=1200 -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: fuzz-${{ matrix.target }}, path: fuzz/artifacts }

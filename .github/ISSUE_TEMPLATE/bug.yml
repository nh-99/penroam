name: Bug report
description: Something doesn't work as it should
body:
  - type: markdown
    attributes:
      value: |
        Please don't include note content, recovery codes, passwords or tokens. Nobody here needs them.
        Security problems go through [private reporting](https://github.com/nh-99/penroam/security/advisories/new), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Was any writing lost or changed?
      options: ["No", "Yes", "Not sure"]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and pen
      placeholder: BOOX Note Air5 C with its stylus
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: Settings → About → Show diagnostic report. Read it, then paste it here.
      render: text

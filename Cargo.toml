[workspace]
resolver = "2"
members = [
  "crates/penroam-core",
  "crates/penroam-storage",
  "crates/penroam-pdf",
  "crates/penroam-interchange",
  "crates/penroam-webdav",
  "crates/penroam-sync-protocol",
  "crates/penroam-sync-testkit",
  "crates/penroam-sync",
  "crates/penroam-search",
  "apps/desktop-mobile/src-tauri",
  "plugins/tauri-plugin-native-ink",
  "plugins/tauri-plugin-native-print",
  "plugins/tauri-plugin-store-billing",
]

[workspace.package]
version = "0.1.0-beta.10"
edition = "2021"
rust-version = "1.90"
license = "MPL-2.0"
repository = "https://github.com/nh-99/penroam"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
sha2 = "0.10"
ts-rs = { version = "12", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }
lopdf = { version = "0.46", default-features = false }
# `deflate-flate2`, not `deflate`: that one switches flate2 to zlib-rs for the whole build, which
# changes the bytes of every compressed page (tests/golden). Decoding would still work.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tempfile = "3"
penroam-core = { path = "crates/penroam-core" }
penroam-storage = { path = "crates/penroam-storage" }
penroam-pdf = { path = "crates/penroam-pdf" }
penroam-interchange = { path = "crates/penroam-interchange" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2

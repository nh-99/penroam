[workspace]
resolver = "2"
members = [
  "crates/penroam-core",
  "crates/penroam-storage",
  "crates/penroam-pdf",
  "crates/penroam-sync-protocol",
  "crates/penroam-sync-testkit",
  "crates/penroam-sync",
  "crates/penroam-search",
  "apps/desktop-mobile/src-tauri",
  "plugins/tauri-plugin-native-ink",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MPL-2.0"
repository = "https://github.com/penroam/penroam"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
sha2 = "0.10"
ts-rs = { version = "12", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }
lopdf = { version = "0.46", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
penroam-core = { path = "crates/penroam-core" }
penroam-storage = { path = "crates/penroam-storage" }
penroam-pdf = { path = "crates/penroam-pdf" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2

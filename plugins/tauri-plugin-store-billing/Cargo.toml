[package]
publish = false
name = "tauri-plugin-store-billing"
description = "Penroam in-app purchases: StoreKit on iOS, reachable only from the app's Rust side"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
links = "tauri-plugin-store-billing"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

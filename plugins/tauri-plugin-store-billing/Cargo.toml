[package]
publish = false
name = "tauri-plugin-store-billing"
description = "Penroam in-app purchases: StoreKit on iOS and in the Mac App Store build, reachable only from the app's Rust side"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
links = "tauri-plugin-store-billing"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# StoreKit in the Mac App Store build. Off by default: Developer ID builds sell through the web.
# Building it needs Xcode, because it compiles `macos/` with the Swift toolchain.
mac-app-store = ["dep:swift-rs"]

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
swift-rs = { version = "1.0.9", features = ["build"], optional = true }

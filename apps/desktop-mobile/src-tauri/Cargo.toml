[package]
name = "penroam-app"
description = "Penroam: offline-first handwriting notebook (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "penroam_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Not used directly: this compiles every DEBUG/TRACE `log` record out of release builds, in all
# crates. The HTTP client used for sync (ureq) dumps raw requests, bearer tokens included, at
# TRACE; with this cap no logger or RUST_LOG setting can bring that back in a shipped app.
log = { version = "0.4", features = ["release_max_level_info"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
penroam-core.workspace = true
penroam-storage.workspace = true
penroam-pdf.workspace = true
penroam-sync = { path = "../../../crates/penroam-sync", features = ["keychain"] }
penroam-sync-protocol = { path = "../../../crates/penroam-sync-protocol" }
tauri-plugin-native-ink = { path = "../../../plugins/tauri-plugin-native-ink" }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[package]
publish = false
name = "penroam-app"
description = "Penroam: offline-first handwriting notebook (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "penroam_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Not used directly: this compiles every DEBUG/TRACE `log` record out of release builds, in all
# crates. The HTTP client used for sync (ureq) dumps raw requests, bearer tokens included, at
# TRACE; with this cap no logger or RUST_LOG setting can bring that back in a shipped app.
log = { version = "0.4", features = ["release_max_level_info"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
gethostname = "1"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
penroam-core.workspace = true
penroam-storage.workspace = true
penroam-pdf.workspace = true
penroam-interchange.workspace = true
penroam-webdav = { path = "../../../crates/penroam-webdav" }
penroam-sync = { path = "../../../crates/penroam-sync", features = ["keychain"] }
penroam-sync-protocol = { path = "../../../crates/penroam-sync-protocol" }
# `windows-ink` only has an effect on Windows (on-device handwriting recognition);
# `onnx-model` runs an installed Penroam handwriting model (the fallback recognizer)
penroam-search = { path = "../../../crates/penroam-search", features = ["windows-ink", "onnx-model"] }
tauri-plugin-native-ink = { path = "../../../plugins/tauri-plugin-native-ink" }
tauri-plugin-native-print = { path = "../../../plugins/tauri-plugin-native-print" }
tauri-plugin-store-billing = { path = "../../../plugins/tauri-plugin-store-billing" }

# Touchpad pinch reaches the app through GTK (src/pinch.rs); the version is the one Tauri links.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Desktop self-update, see src/updates.rs. Mobile updates come from the stores or a new APK.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"
url = "2"

# Mobile sign-in: the identity provider's answer comes back as an `ink.penroam.app:` link.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2.6"

# ONNX Runtime for the handwriting model. Desktop and iOS link pyke's prebuilt runtime at build
# time; Android opens Microsoft's libonnxruntime.so (onnxruntime-android, packaged by Gradle,
# see scripts/patch-android.py) at run time.
[target.'cfg(not(target_os = "android"))'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native"] }

[target.'cfg(target_os = "android")'.dependencies]
# `api-22` matches onnxruntime-android 1.22; `ort` rejects a runtime older than this API level, and
# its load-dynamic code does not compile without an API feature (they are off with its defaults).
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-22"] }

# search worker: power state and background thread priority
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Power", "Win32_System_Threading"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

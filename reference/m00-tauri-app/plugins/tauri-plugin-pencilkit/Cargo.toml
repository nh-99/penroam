[package]
name = "tauri-plugin-pencilkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Tauri v2 iOS plugin embedding a native PencilKit canvas (shared ios/InkKit PencilInk backend) over the WebView"
links = "tauri-plugin-pencilkit"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

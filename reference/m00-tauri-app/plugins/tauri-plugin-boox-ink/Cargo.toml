[package]
name = "tauri-plugin-boox-ink"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Tauri v2 plugin hosting the shared BOOX native ink View (android/boox-ink) over the WebView"
links = "tauri-plugin-boox-ink"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
